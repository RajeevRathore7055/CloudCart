{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="admin-head"><div><div class="eyebrow">Admin</div><h1 class="page-title">{{ title }}</h1></div></div>
{% set active='products' %}{% include "admin/_nav.html" %}
{% for e in errors %}<div class="alert-cc" role="alert"><i class="bi bi-exclamation-triangle-fill"></i>{{ e }}</div>{% endfor %}
<form method="post" enctype="multipart/form-data" class="glass glass-pad" style="max-width:780px">
  <div class="mb-3"><label class="form-label" for="pname">Name</label><input id="pname" name="name" class="form-control" value="{{ p.name or '' }}" required></div>
  <div class="row g-3 mb-3">
    <div class="col-md-6"><label class="form-label" for="pcat">Category</label>
      <select id="pcat" name="category_id" class="form-select" required>{% for c in all_categories %}<option value="{{ c.id }}" {% if p.category_id|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
    <div class="col-6 col-md-3"><label class="form-label" for="pprice">Price (₹)</label><input id="pprice" name="price" type="number" step="0.01" min="0" class="form-control" value="{{ p.price or '' }}" required></div>
    <div class="col-6 col-md-3"><label class="form-label" for="pstock">Stock</label><input id="pstock" name="stock" type="number" min="0" class="form-control" value="{{ p.stock if p.stock is not none else '' }}" required></div>
  </div>
  <div class="mb-3"><label class="form-label" for="pdesc">Description</label><textarea id="pdesc" name="description" rows="4" class="form-control">{{ p.description or '' }}</textarea></div>
  <div class="mb-3"><label class="form-label" for="imageInput">Image (JPG/PNG/WEBP, max 2MB){% if p.image_url %} <span class="text-muted fw-normal">- current: {{ p.image_url }}</span>{% endif %}</label>
    <input id="imageInput" type="file" name="image" accept="image/*" class="form-control">
    <img id="imagePreview" class="upload-preview" alt="Selected image preview">
    {% if p.image_url %}<img class="upload-preview" style="display:block" src="{{ img(p.image_url) }}" alt="Current product image" onerror="this.style.display='none'">{% endif %}</div>
  <div class="form-check form-switch mb-4"><input class="form-check-input" type="checkbox" name="is_featured" value="1" id="f" {% if p.is_featured %}checked{% endif %}><label class="form-check-label" for="f">Featured on home page</label></div>
  <div class="d-flex gap-2"><button class="btn btn-glow px-4"><i class="bi bi-check2"></i> Save</button><a href="/admin/products" class="btn btn-ghost">Cancel</a></div>
</form>
{% endblock %}
